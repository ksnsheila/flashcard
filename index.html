<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上記憶卡練習</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂部控制列 */
    .header-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    select {
      flex: 1;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: var(--primary);
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-restart {
      background-color: #f1f5f9;
      color: var(--text-main);
      white-space: nowrap;
    }

    .btn-restart:hover {
      background-color: #e2e8f0;
    }

    /* 卡片區域 (3D 翻轉容器) */
    .card-scene {
      width: 100%;
      height: 440px;
      perspective: 1200px;
      cursor: pointer;
      user-select: none;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 牌面設計 (Front) */
    .card-front {
      padding: 20px;
    }

    /* 模式 1：圖片 + 文字 (80% 圖片 / 20% 文字) */
    .card-front.mode-both .img-box {
      height: 80%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 12px;
    }

    .card-front.mode-both .prompt-box {
      height: 20%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* 模式 2：純圖片 (100% 置中) */
    .card-front.mode-img .img-box {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 模式 3：純文字 (100% 置中) */
    .card-front.mode-text .prompt-box {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      padding: 20px;
      line-height: 1.4;
    }

    /* 圖片等比例縮放，不裁切、不壓扁 */
    .img-box img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .flip-hint {
      position: absolute;
      bottom: 10px;
      right: 16px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
    }

    /* 牌底設計 (Back) */
    .card-back {
      transform: rotateY(180deg);
      padding: 32px 28px;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-y: auto;
    }

    .back-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #e0e7ff;
      width: 100%;
    }

    .back-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* 底部導覽列 */
    .footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .btn-nav {
      background-color: var(--primary);
      color: white;
      min-width: 100px;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-nav:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .progress-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* 載入與完成狀態 */
    .status-box {
      height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      padding: 30px;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部控制列 -->
    <div class="header-controls">
      <select id="deckSelect" disabled>
        <option value="">載入卡組中...</option>
      </select>
      <button id="restartBtn" class="btn-restart" title="重新洗牌並開始">
        ↻ 重新開始
      </button>
    </div>

    <!-- 載入中畫面 -->
    <div id="loadingBox" class="status-box">
      <div class="spinner"></div>
      <p style="color: var(--text-sub); font-weight: 500;">正在從資料庫讀取記憶卡...</p>
    </div>

    <!-- 錯誤訊息畫面 -->
    <div id="errorBox" class="status-box hidden">
      <p style="color: #ef4444; font-weight: 700; font-size: 1.2rem;">讀取失敗</p>
      <p id="errorMsg" style="color: var(--text-sub);"></p>
    </div>

    <!-- 卡片主體 -->
    <div id="cardScene" class="card-scene hidden">
      <div id="flashcard" class="card">
        <!-- 牌面 -->
        <div id="cardFront" class="card-face card-front">
          <!-- 內容由 JS 動態生成 -->
        </div>
        <!-- 牌底 -->
        <div id="cardBack" class="card-face card-back">
          <div id="backTitle" class="back-title"></div>
          <div id="backContent" class="back-content"></div>
        </div>
      </div>
    </div>

    <!-- 底部導覽列 -->
    <div id="footerNav" class="footer-nav hidden">
      <button id="prevBtn" class="btn-nav">← 上一張</button>
      <span id="progressText" class="progress-text">1 / 10</span>
      <button id="nextBtn" class="btn-nav">下一張 →</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 🔴 請在此貼上你的 SheetDB API 網址
    // ==========================================
    const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/你的API代碼';

    // 狀態管理
    let allDecks = {};        // 依卡組名稱分類的原始資料 { "卡組A": [...], "卡組B": [...] }
    let currentDeckCards = []; // 當前洗牌後的卡組陣列
    let currentIndex = 0;      // 當前卡片索引
    let isFlipped = false;     // 卡片是否翻面

    // DOM 元素
    const deckSelect = document.getElementById('deckSelect');
    const restartBtn = document.getElementById('restartBtn');
    const loadingBox = document.getElementById('loadingBox');
    const errorBox = document.getElementById('errorBox');
    const errorMsg = document.getElementById('errorMsg');
    const cardScene = document.getElementById('cardScene');
    const flashcard = document.getElementById('flashcard');
    const cardFront = document.getElementById('cardFront');
    const backTitle = document.getElementById('backTitle');
    const backContent = document.getElementById('backContent');
    const footerNav = document.getElementById('footerNav');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressText = document.getElementById('progressText');

    // 初始化：抓取 SheetDB 資料
    async function init() {
      try {
        if (SHEETDB_API_URL.includes('你的API代碼')) {
          throw new Error('請先在程式碼中填入正確的 SheetDB API 網址。');
        }

        const response = await fetch(SHEETDB_API_URL);
        if (!response.ok) {
          throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
        }

        const rawData = await response.json();
        processData(rawData);
      } catch (err) {
        loadingBox.classList.add('hidden');
        errorBox.classList.remove('hidden');
        errorMsg.textContent = err.message;
      }
    }

    // 解析並分類卡組資料
    function processData(rows) {
      allDecks = {};

      rows.forEach(row => {
        // 取得所有欄位的值（按試算表從左到右的順序）
        const keys = Object.keys(row);
        const deckName = (row.deck || row[keys[0]] || '').trim();
        
        // 若該列沒有卡組名稱則跳過
        if (!deckName) return;

        const imageUrl = (row.image || row[keys[1]] || '').trim();
        const promptText = (row.prompt || row[keys[2]] || '').trim();
        const answerTitle = (row.title || row[keys[3]] || '').trim();

        // E 欄及之後的所有欄位皆視為牌底說明內容，不為空就收集起來
        const descriptions = [];
        for (let i = 4; i < keys.length; i++) {
          const val = (row[keys[i]] || '').trim();
          if (val !== '') {
            descriptions.push(val);
          }
        }

        if (!allDecks[deckName]) {
          allDecks[deckName] = [];
        }

        allDecks[deckName].push({
          image: imageUrl,
          prompt: promptText,
          title: answerTitle,
          descriptions: descriptions
        });
      });

      const deckNames = Object.keys(allDecks);
      if (deckNames.length === 0) {
        throw new Error('試算表中找不到任何有效的卡組資料，請檢查第一列標題與內容。');
      }

      // 填充下拉選單
      deckSelect.innerHTML = '';
      deckNames.forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = `${name} (${allDecks[name].length} 張)`;
        deckSelect.appendChild(option);
      });

      deckSelect.disabled = false;
      loadingBox.classList.add('hidden');
      cardScene.classList.remove('hidden');
      footerNav.classList.remove('hidden');

      // 預設載入第一個卡組
      startDeck(deckNames[0]);
    }

    // Fisher-Yates 洗牌演算法（隨機不重複）
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 開始或重新開始指定卡組
    function startDeck(deckName) {
      if (!allDecks[deckName]) return;
      currentDeckCards = shuffleArray(allDecks[deckName]);
      currentIndex = 0;
      renderCard();
    }

    // 渲染當前卡片
    function renderCard() {
      // 確保切回牌面（無動畫瞬間重置，避免偷看到下一張牌底）
      isFlipped = false;
      flashcard.style.transition = 'none';
      flashcard.classList.remove('is-flipped');
      // 強制瀏覽器重繪後恢復過渡動畫
      void flashcard.offsetWidth;
      flashcard.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';

      const card = currentDeckCards[currentIndex];

      // 1. 處理牌面佈局 (B欄圖片 & C欄提示詞)
      cardFront.className = 'card-face card-front';
      cardFront.innerHTML = '';

      const hasImg = card.image !== '';
      const hasPrompt = card.prompt !== '';

      if (hasImg && hasPrompt) {
        // 兩者都有：上方 80% 圖片，下方 20% 提示詞
        cardFront.classList.add('mode-both');
        cardFront.innerHTML = `
          <div class="img-box"><img src="${card.image}" alt="記憶卡圖片"></div>
          <div class="prompt-box">${escapeHtml(card.prompt)}</div>
          <span class="flip-hint">點擊翻面</span>
        `;
      } else if (hasImg) {
        // 只有圖片：置中顯示
        cardFront.classList.add('mode-img');
        cardFront.innerHTML = `
          <div class="img-box"><img src="${card.image}" alt="記憶卡圖片"></div>
          <span class="flip-hint">點擊翻面</span>
        `;
      } else {
        // 只有文字（或皆無）：置中顯示提示詞
        cardFront.classList.add('mode-text');
        cardFront.innerHTML = `
          <div class="prompt-box">${escapeHtml(card.prompt || '(無題目內容)')}</div>
          <span class="flip-hint">點擊翻面</span>
        `;
      }

      // 2. 處理牌底內容 (D欄標題 & E欄之後多行說明)
      backTitle.textContent = card.title || '答案';
      backContent.innerHTML = '';
      
      if (card.descriptions.length > 0) {
        card.descriptions.forEach(desc => {
          const p = document.createElement('p');
          p.textContent = desc;
          backContent.appendChild(p);
        });
      } else {
        const p = document.createElement('p');
        p.style.color = '#94a3b8';
        p.textContent = '(無詳細說明)';
        backContent.appendChild(p);
      }

      // 3. 更新進度與按鈕狀態
      progressText.textContent = `${currentIndex + 1} / ${currentDeckCards.length}`;
      prevBtn.disabled = currentIndex === 0;
      
      if (currentIndex === currentDeckCards.length - 1) {
        nextBtn.textContent = '已完成 ✓';
        nextBtn.disabled = true;
      } else {
        nextBtn.textContent = '下一張 →';
        nextBtn.disabled = false;
      }
    }

    // 防止 XSS 攻擊的文字轉義函式
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 事件監聽：點擊卡片翻面
    cardScene.addEventListener('click', () => {
      isFlipped = !isFlipped;
      flashcard.classList.toggle('is-flipped', isFlipped);
    });

    // 事件監聽：切換卡組
    deckSelect.addEventListener('change', (e) => {
      startDeck(e.target.value);
    });

    // 事件監聽：重新開始（重新洗牌）
    restartBtn.addEventListener('click', () => {
      startDeck(deckSelect.value);
    });

    // 事件監聽：上一張
    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    });

    // 事件監聽：下一張
    nextBtn.addEventListener('click', () => {
      if (currentIndex < currentDeckCards.length - 1) {
        currentIndex++;
        renderCard();
      }
    });

    // 啟動程式
    init();
  </script>
</body>
</html>
