<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧雙面學習卡 Flashcards</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }
    
    /* 3D 翻頁動畫 CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* 自訂 Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header 導覽列 -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-200">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">FlashMaster</h1>
          <p class="text-xs text-slate-500">智慧圖片與文字學習卡</p>
        </div>
      </div>

      <!-- 頁籤切換按鈕 -->
      <nav class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl">
        <button id="nav-review-btn" onclick="switchTab('review')" class="px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white text-indigo-600">
          <i class="fa-solid fa-play mr-1.5"></i>複習模式
        </button>
        <button id="nav-manage-btn" onclick="switchTab('manage')" class="px-4 py-2 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-sliders mr-1.5"></i>卡組管理
        </button>
      </nav>
    </div>
  </header>

  <!-- 主要內容區塊 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col">

    <!-- ================= 1. 複習模式 (Review View) ================= -->
    <section id="review-view" class="flex-1 flex flex-col items-center justify-center max-w-2xl mx-auto w-full">
      
      <!-- 卡組選擇列與工具列 -->
      <div class="w-full mb-4 flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex items-center gap-2 flex-1 min-w-[200px]">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">卡組：</span>
          <select id="deck-selector" onchange="onDeckChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- 動態生成選項 -->
          </select>
        </div>
        
        <button onclick="resetAndShuffleDeck()" title="重置並洗牌" class="px-3.5 py-1.5 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 active:scale-95 rounded-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right text-indigo-500"></i>
          <span>重新洗牌</span>
        </button>
      </div>

      <!-- 進度條與數字 -->
      <div class="w-full mb-4">
        <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1">
          <span id="progress-text">卡片 0 / 0</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-300 w-0"></div>
        </div>
      </div>

      <!-- 卡片本體容器 (3D 翻轉) -->
      <div id="card-container-wrapper" class="w-full relative h-[450px] sm:h-[500px] perspective-1000 my-2">
        
        <!-- Flashcard 物件 -->
        <div id="flashcard" onclick="flipCard()" class="w-full h-full cursor-pointer relative transform-style-3d shadow-xl hover:shadow-2xl rounded-3xl border border-slate-200/80 bg-white transition-shadow duration-300">
          
          <!-- 正面 (Front) -->
          <div id="card-front" class="absolute inset-0 w-full h-full backface-hidden rounded-3xl bg-white flex flex-col overflow-hidden select-none">
            
            <!-- 圖片區塊 (預設佔據 80%) -->
            <div id="front-image-container" class="h-[80%] w-full bg-slate-100 relative overflow-hidden flex items-center justify-center border-b border-slate-100">
              <img id="front-image" src="" alt="Card Image" class="w-full h-full object-contain p-2 transition-transform duration-300 hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=無圖片';">
              <div id="front-no-img" class="hidden flex-col items-center justify-center text-slate-400 gap-2">
                <i class="fa-regular fa-image text-4xl"></i>
                <span class="text-xs">未提供圖片</span>
              </div>
            </div>

            <!-- 提示詞區塊 (預設佔據 20%) -->
            <div id="front-prompt-container" class="h-[20%] w-full bg-white px-5 py-3 flex items-center justify-center text-center">
              <p id="front-prompt" class="text-base sm:text-lg font-semibold text-slate-800 line-clamp-2">點擊卡片查看答案</p>
            </div>

            <!-- 右上角點擊翻牌提示 -->
            <div class="absolute top-3 right-3 bg-slate-900/60 backdrop-blur-sm text-white px-2.5 py-1 rounded-full text-xs flex items-center gap-1 shadow">
              <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
              <span>翻牌</span>
            </div>
          </div>

          <!-- 背面 (Back) -->
          <div id="card-back" class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-indigo-50/50 via-white to-purple-50/50 p-6 sm:p-8 flex flex-col justify-between overflow-y-auto border-2 border-indigo-200">
            <div>
              <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-200">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">解答與細節</span>
                <span class="text-xs text-slate-400">點擊再次翻轉</span>
              </div>
              
              <!-- 圖片名稱 / 標題 -->
              <h2 id="back-title" class="text-2xl font-bold text-slate-900 mb-4 break-words">圖片名稱</h2>
              
              <!-- 背面詳細內容 -->
              <div id="back-content" class="text-slate-600 text-sm sm:text-base leading-relaxed whitespace-pre-wrap break-words">
                這裡將顯示這張學習卡的詳細文字解析說明。
              </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex items-center justify-center text-xs text-slate-400 gap-1.5">
              <i class="fa-regular fa-lightbulb text-amber-500"></i>
              <span>已成功揭曉卡片內容</span>
            </div>
          </div>

        </div>

        <!-- 空卡組/複習完成畫面 (預設隱藏) -->
        <div id="completion-screen" class="hidden absolute inset-0 w-full h-full bg-white/95 backdrop-blur-md rounded-3xl border border-slate-200 flex flex-col items-center justify-center p-6 text-center z-20 shadow-lg">
          <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mb-4 animate-bounce">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <h3 class="text-2xl font-bold text-slate-800 mb-2">太棒了！複習完成！</h3>
          <p class="text-sm text-slate-500 max-w-sm mb-6">您已經瀏覽完此卡組中的所有卡片。</p>
          <button onclick="resetAndShuffleDeck()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center gap-2">
            <i class="fa-solid fa-rotate-right"></i>
            <span>再次重新洗牌開始</span>
          </button>
        </div>

        <!-- 無卡片警告畫面 -->
        <div id="empty-screen" class="hidden absolute inset-0 w-full h-full bg-white rounded-3xl border border-dashed border-slate-300 flex flex-col items-center justify-center p-6 text-center z-20">
          <div class="w-14 h-14 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center text-2xl mb-3">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-700 mb-1">此卡组目前尚無卡片</h3>
          <p class="text-xs text-slate-500 mb-4">請切換至「卡組管理」新增內容。</p>
          <button onclick="switchTab('manage')" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition-all">
            前往新增卡片
          </button>
        </div>

      </div>

      <!-- 控制按鈕區 -->
      <div class="w-full flex items-center justify-between gap-4 mt-4">
        <button id="prev-btn" onclick="prevCard()" class="flex-1 py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 active:scale-95 text-slate-700 font-semibold rounded-2xl shadow-sm transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
          <i class="fa-solid fa-arrow-left"></i>
          <span>上一張</span>
        </button>

        <button onclick="flipCard()" class="py-3 px-5 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 active:scale-95 font-semibold rounded-2xl border border-indigo-200 transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-repeat"></i>
          <span class="hidden sm:inline">翻面</span>
        </button>

        <button id="next-btn" onclick="nextCard()" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold rounded-2xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
          <span>下一張</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </section>

    <!-- ================= 2. 卡組與卡片管理設定版面 (Manage View) ================= -->
    <section id="manage-view" class="hidden flex-1 flex-col gap-6">
      
      <!-- 頂部標題與管理操作 -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
        <div>
          <h2 class="text-xl font-bold text-slate-900">學習卡與卡組管理</h2>
          <p class="text-xs text-slate-500">建立新的卡片、修改說明或管理卡組分類</p>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="openDeckModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition-all flex items-center gap-2">
            <i class="fa-solid fa-folder-plus text-slate-500"></i>
            <span>新增卡組</span>
          </button>
          <button onclick="openCardModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center gap-2">
            <i class="fa-solid fa-plus"></i>
            <span>新增卡片</span>
          </button>
        </div>
      </div>

      <!-- 卡組切換 Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-2" id="manage-deck-tabs">
        <!-- 動態產生卡組標籤 -->
      </div>

      <!-- 當前卡組動作區 (編輯卡组 / 刪除卡組) -->
      <div class="flex items-center justify-between text-sm px-1">
        <div class="flex items-center gap-2">
          <span class="font-bold text-slate-800" id="current-manage-deck-title">卡組名稱</span>
          <span id="current-manage-deck-count" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">0 張卡片</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="editCurrentDeck()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">重命名卡組</button>
          <button onclick="deleteCurrentDeck()" class="text-xs text-rose-500 hover:text-rose-700 font-medium">刪除此卡組</button>
        </div>
      </div>

      <!-- 卡片清單網格 -->
      <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- 動態渲染卡片列表 -->
      </div>

    </section>

  </main>

  <!-- ================= Modal 彈窗區塊 ================= -->

  <!-- 1. 新增 / 編輯卡組 Modal -->
  <div id="deck-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
      <h3 id="deck-modal-title" class="text-lg font-bold text-slate-900 mb-4">新增卡組</h3>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-600 mb-1">卡組名稱</label>
        <input type="text" id="deck-name-input" placeholder="例如：世界名畫鑑賞..." class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeDeckModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
        <button onclick="saveDeck()" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow">儲存</button>
      </div>
    </div>
  </div>

  <!-- 2. 新增 / 編輯卡片 Modal -->
  <div id="card-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 my-8 transform transition-all">
      <div class="flex justify-between items-center mb-4">
        <h3 id="card-modal-title" class="text-lg font-bold text-slate-900">新增卡片</h3>
        <button onclick="closeCardModal()" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <form id="card-form" onsubmit="event.preventDefault(); saveCard();" class="space-y-4">
        
        <!-- 圖片來源選擇 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">正面圖片來源</label>
          <div class="flex items-center gap-4 mb-2">
            <label class="inline-flex items-center text-xs font-medium text-slate-700 cursor-pointer">
              <input type="radio" name="image-source-type" value="url" checked onchange="toggleImageInputType()" class="text-indigo-600 focus:ring-indigo-500">
              <span class="ml-1.5">使用圖片網址 (URL)</span>
            </label>
            <label class="inline-flex items-center text-xs font-medium text-slate-700 cursor-pointer">
              <input type="radio" name="image-source-type" value="file" onchange="toggleImageInputType()" class="text-indigo-600 focus:ring-indigo-500">
              <span class="ml-1.5">上載本地圖片 (Upload)</span>
            </label>
          </div>

          <!-- URL 輸入框 -->
          <div id="image-url-box">
            <input type="url" id="card-img-url" placeholder="https://example.com/image.jpg" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" oninput="previewImageInput()">
          </div>

          <!-- File 上傳框 -->
          <div id="image-file-box" class="hidden">
            <input type="file" id="card-img-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" onchange="handleFileUpload(event)">
          </div>

          <!-- 圖片預覽 -->
          <div class="mt-2 h-32 w-full bg-slate-100 rounded-xl border border-slate-200 flex items-center justify-center overflow-hidden relative">
            <img id="img-preview" src="" alt="預覽圖片" class="h-full w-full object-contain hidden">
            <span id="img-preview-placeholder" class="text-xs text-slate-400">圖片預覽區</span>
          </div>
        </div>

        <!-- 正面提示詞 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">正面提示詞 (Cue / Prompt)</label>
          <input type="text" id="card-front-prompt" placeholder="例如：這幅畫作的創作者與名稱是？" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <p class="text-[11px] text-slate-400 mt-1">若同時有圖片與提示詞，正面會以 80% 圖片與 20% 提示詞展現。</p>
        </div>

        <!-- 卡片名稱 (背面標題) -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">卡片名稱 / 答案標題 <span class="text-rose-500">*</span></label>
          <input type="text" id="card-title" required placeholder="例如：梵谷《星夜》" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- 背面詳細內容 -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">背面詳細內容說明</label>
          <textarea id="card-back-content" rows="4" placeholder="輸入詳細解析、補充說明或記憶要點..." class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeCardModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow">儲存卡片</button>
        </div>

      </form>
    </div>
  </div>

  <!-- JavaScript 邏輯程式碼 -->
  <script>
    // ================= 預設資料 (Default Decks & Cards) =================
    const DEFAULT_DECKS = [
      {
        id: 'deck-art-demo',
        name: '藝術名畫與歷史解析',
        cards: [
          {
            id: 'c1',
            image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80',
            prompt: '請識別這幅印象派代表畫作名稱與作者？',
            title: '文森·梵谷《戴戴星空畫作 (星夜)》',
            content: '《星夜》（The Starry Night）是荷蘭後印象派畫家文森·梵谷於1889年在法國聖雷米的一家精神醫院裡創作的著名油畫。現藏於紐約現代藝術博物館（MoMA）。畫中充滿旋轉的線條與強烈的色彩對比，展現了他極具情感張力的內心世界。'
          },
          {
            id: 'c2',
            image: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80',
            prompt: '這幅畫繪製了誰的神秘微笑？',
            title: '李奧納多·達文西《蒙娜麗莎》',
            content: '《蒙娜麗莎》（Mona Lisa）是文藝復興時期畫家李奧納多·达芬奇的代表作。作品以暈塗法（Sfumato）著稱，微妙的微笑顔色與背景的和諧融為一體，現收藏於法國巴黎的羅浮宮。'
          },
          {
            id: 'c3',
            image: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=800&q=80',
            prompt: '此現代色彩藝術代表了什麼視覺感受？',
            title: '抽象視覺美學與色彩理論',
            content: '色彩理論研究顏色如何相互作用、對情緒的影響以及色彩搭配原則。補色對比（如藍與橘）能產生強烈的視覺張力，而相鄰色則能營造和諧溫和的氛圍。'
          }
        ]
      },
      {
        id: 'deck-design-demo',
        name: 'UI/UX 設計基礎原則',
        cards: [
          {
            id: 'c4',
            image: '',
            prompt: 'UX 設計中的「格式塔心理學 (Gestalt)」接近性原則是什麼？',
            title: '接近性原則 (Proximity)',
            content: '接近性原則指出：距離較近的物體會被大腦自動視為屬於同一群組或具有相關性。在 UI 設計中，常用於將相關的標籤與輸入框靠近放置，以降低使用者的認知負載。'
          },
          {
            id: 'c5',
            image: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=800&q=80',
            prompt: '這張圖展示了什麼響應式設計概念？',
            title: '響應式網頁設計 (Responsive Web Design)',
            content: 'RWD 是一種網頁設計方法，使網頁能根據使用者設備的螢幕尺寸（手機、平板、桌機）自動調整排版與佈局，提供最佳的瀏覽體驗。'
          }
        ]
      }
    ];

    // ================= 全局狀態 (State) =================
    let decks = [];
    let currentDeckId = '';
    let currentReviewCards = []; // 目前洗牌後的卡片陣列
    let currentCardIndex = 0;
    let isFlipped = false;

    // 編輯 Modal 狀態
    let editingDeckId = null;
    let editingCardId = null;
    let currentUploadedBase64 = ''; // 儲存暫存的 Base64 圖片

    // ================= 初始化 (Initialization) =================
    window.onload = function() {
      loadData();
      
      // 嘗試從 localStorage 恢復上次的複習狀態
      const savedReviewState = localStorage.getItem('flashcard_review_state');
      if (savedReviewState) {
        try {
          const state = JSON.parse(savedReviewState);
          if (decks.some(d => d.id === state.currentDeckId)) {
            currentDeckId = state.currentDeckId;
            // 驗證並恢復該卡組的複習卡片與索引
            const deck = decks.find(d => d.id === currentDeckId);
            if (state.currentReviewCards && state.currentReviewCards.length > 0) {
              currentReviewCards = state.currentReviewCards;
              currentCardIndex = Math.min(state.currentCardIndex, currentReviewCards.length);
            } else {
              startReviewSession();
            }
          } else if (decks.length > 0) {
            currentDeckId = decks[0].id;
            startReviewSession();
          }
        } catch (e) {
          console.error("Failed to parse review state", e);
          if (decks.length > 0) currentDeckId = decks[0].id;
          startReviewSession();
        }
      } else {
        if (decks.length > 0) {
          currentDeckId = decks[0].id;
        }
        startReviewSession();
      }

      renderDeckOptions();
      if (currentReviewCards.length > 0) {
        displayCurrentCard();
      }
      renderManageView();
    };

    // 載入資料 (LocalStorage)
    function loadData() {
      const saved = localStorage.getItem('flashcard_decks');
      if (saved) {
        try {
          decks = JSON.parse(saved);
        } catch (e) {
          console.error("Failed to parse saved data", e);
          decks = DEFAULT_DECKS;
        }
      } else {
        decks = DEFAULT_DECKS;
        saveData();
      }
    }

    // 儲存資料
    function saveData() {
      localStorage.setItem('flashcard_decks', JSON.stringify(decks));
    }

    // 儲存複習進度狀態
    function saveReviewState() {
      const state = {
        currentDeckId: currentDeckId,
        currentReviewCards: currentReviewCards,
        currentCardIndex: currentCardIndex
      };
      localStorage.setItem('flashcard_review_state', JSON.stringify(state));
    }

    // Fisher-Yates 隨機洗牌演算法
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ================= 頁籤切換 (Tab Navigation) =================
    function switchTab(tab) {
      const reviewView = document.getElementById('review-view');
      const manageView = document.getElementById('manage-view');
      const navReviewBtn = document.getElementById('nav-review-btn');
      const navManageBtn = document.getElementById('nav-manage-btn');

      if (tab === 'review') {
        reviewView.classList.remove('hidden');
        reviewView.classList.add('flex');
        manageView.classList.add('hidden');
        manageView.classList.remove('flex');

        navReviewBtn.className = "px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white text-indigo-600";
        navManageBtn.className = "px-4 py-2 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900";
        
        // 重新整合選單並重新啟動複習
        renderDeckOptions();
        startReviewSession();
      } else {
        reviewView.classList.add('hidden');
        reviewView.classList.remove('flex');
        manageView.classList.remove('hidden');
        manageView.classList.add('flex');

        navManageBtn.className = "px-4 py-2 text-sm font-semibold rounded-lg transition-all shadow-sm bg-white text-indigo-600";
        navReviewBtn.className = "px-4 py-2 text-sm font-semibold rounded-lg transition-all text-slate-600 hover:text-slate-900";

        renderManageView();
      }
    }

    // ================= 複習模式邏輯 (Review Logic) =================

    // 下拉選單渲染
    function renderDeckOptions() {
      const selector = document.getElementById('deck-selector');
      selector.innerHTML = '';
      decks.forEach(deck => {
        const opt = document.createElement('option');
        opt.value = deck.id;
        opt.textContent = `${deck.name} (${deck.cards.length}張)`;
        if (deck.id === currentDeckId) opt.selected = true;
        selector.appendChild(opt);
      });
    }

    // 當改變選擇卡組時
    function onDeckChange() {
      const selector = document.getElementById('deck-selector');
      currentDeckId = selector.value;
      startReviewSession();
    }

    // 開始/重置複習 session
    function startReviewSession() {
      const deck = decks.find(d => d.id === currentDeckId);
      const emptyScreen = document.getElementById('empty-screen');
      const completionScreen = document.getElementById('completion-screen');

      isFlipped = false;
      updateCardFlipState();

      if (!deck || deck.cards.length === 0) {
        currentReviewCards = [];
        currentCardIndex = 0;
        emptyScreen.classList.remove('hidden');
        completionScreen.classList.add('hidden');
        updateProgress();
        saveReviewState();
        return;
      }

      emptyScreen.classList.add('hidden');
      completionScreen.classList.add('hidden');

      // 隨機洗牌不重複
      currentReviewCards = shuffleArray(deck.cards);
      currentCardIndex = 0;

      displayCurrentCard();
      saveReviewState();
    }

    // 重新洗牌按鈕操作
    function resetAndShuffleDeck() {
      startReviewSession();
    }

    // 渲染當前卡片內容
    function displayCurrentCard() {
      if (currentReviewCards.length === 0) return;

      const card = currentReviewCards[currentCardIndex];
      const frontImgContainer = document.getElementById('front-image-container');
      const frontImg = document.getElementById('front-image');
      const frontNoImg = document.getElementById('front-no-img');
      const frontPromptContainer = document.getElementById('front-prompt-container');
      const frontPrompt = document.getElementById('front-prompt');

      const backTitle = document.getElementById('back-title');
      const backContent = document.getElementById('back-content');

      // 正面圖片與提示詞 80 / 20 比例佈局調配
      if (card.image && card.prompt) {
        frontImgContainer.className = "h-[80%] w-full bg-slate-100 relative overflow-hidden flex items-center justify-center border-b border-slate-100";
        frontPromptContainer.className = "h-[20%] w-full bg-white px-5 py-3 flex items-center justify-center text-center";
        
        frontImg.src = card.image;
        frontImg.classList.remove('hidden');
        frontNoImg.classList.add('hidden');
        frontPrompt.textContent = card.prompt;
      } else if (card.image && !card.prompt) {
        // 只有圖片：佔據 100%
        frontImgContainer.className = "h-full w-full bg-slate-100 relative overflow-hidden flex items-center justify-center";
        frontPromptContainer.className = "hidden";
        
        frontImg.src = card.image;
        frontImg.classList.remove('hidden');
        frontNoImg.classList.add('hidden');
      } else if (!card.image && card.prompt) {
        // 只有提示詞：文字滿版置中
        frontImgContainer.className = "hidden";
        frontPromptContainer.className = "h-full w-full bg-white px-6 py-6 flex items-center justify-center text-center";
        frontPrompt.textContent = card.prompt;
      } else {
        // 兩者皆無
        frontImgContainer.className = "h-[80%] w-full bg-slate-100 relative overflow-hidden flex items-center justify-center";
        frontPromptContainer.className = "h-[20%] w-full bg-white px-5 py-3 flex items-center justify-center text-center";
        frontImg.classList.add('hidden');
        frontNoImg.classList.remove('hidden');
        frontPrompt.textContent = "（點擊查看答案）";
      }

      // 背面內容設置
      backTitle.textContent = card.title || '無標題';
      backContent.textContent = card.content || '未提供詳細內容';

      // 確保卡片回到正面
      isFlipped = false;
      updateCardFlipState();
      updateProgress();
      saveReviewState();
    }

    // 翻牌切換
    function flipCard() {
      if (currentReviewCards.length === 0) return;
      isFlipped = !isFlipped;
      updateCardFlipState();
    }

    function updateCardFlipState() {
      const cardEl = document.getElementById('flashcard');
      if (isFlipped) {
        cardEl.classList.add('rotate-y-180');
      } else {
        cardEl.classList.remove('rotate-y-180');
      }
    }

    // 上一張 / 下一張
    function nextCard() {
      if (currentCardIndex < currentReviewCards.length - 1) {
        currentCardIndex++;
        displayCurrentCard();
      } else if (currentCardIndex === currentReviewCards.length - 1) {
        // 已經到最後一張，顯示完成畫面
        document.getElementById('completion-screen').classList.remove('hidden');
        currentCardIndex++;
        updateProgress();
        saveReviewState();
      }
    }

    function prevCard() {
      if (document.getElementById('completion-screen').classList.contains('hidden') === false) {
        document.getElementById('completion-screen').classList.add('hidden');
        currentCardIndex = currentReviewCards.length - 1;
        displayCurrentCard();
        return;
      }
      if (currentCardIndex > 0) {
        currentCardIndex--;
        displayCurrentCard();
      }
    }

    // 更新進度條
    function updateProgress() {
      const total = currentReviewCards.length;
      const current = Math.min(currentCardIndex + 1, total);
      const percent = total > 0 ? Math.round((currentCardIndex / total) * 100) : 0;

      document.getElementById('progress-text').textContent = `卡片 ${total === 0 ? 0 : Math.min(currentCardIndex + 1, total)} / ${total}`;
      document.getElementById('progress-percent').textContent = `${total === 0 || currentCardIndex >= total ? 100 : percent}%`;
      document.getElementById('progress-bar').style.width = `${total === 0 || currentCardIndex >= total ? 100 : percent}%`;

      // 按鈕停用狀態控制
      document.getElementById('prev-btn').disabled = currentCardIndex === 0 && document.getElementById('completion-screen').classList.contains('hidden');
      document.getElementById('next-btn').disabled = currentCardIndex >= total;
    }

    // ================= 設定與管理邏輯 (Manage Logic) =================

    function renderManageView() {
      const tabsContainer = document.getElementById('manage-deck-tabs');
      tabsContainer.innerHTML = '';

      if (decks.length === 0) {
        document.getElementById('current-manage-deck-title').textContent = '無卡組';
        document.getElementById('current-manage-deck-count').textContent = '0 張卡片';
        document.getElementById('cards-grid').innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">請點擊上方按鈕建立新卡組</div>';
        return;
      }

      // 確保 currentDeckId 有效
      if (!decks.some(d => d.id === currentDeckId)) {
        currentDeckId = decks[0].id;
      }

      // 渲染卡組 Tabs
      decks.forEach(deck => {
        const isActive = deck.id === currentDeckId;
        const btn = document.createElement('button');
        btn.onclick = () => {
          currentDeckId = deck.id;
          renderManageView();
        };
        btn.className = `px-4 py-2 text-xs font-semibold rounded-xl whitespace-nowrap transition-all ${
          isActive 
            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' 
            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
        }`;
        btn.textContent = `${deck.name} (${deck.cards.length})`;
        tabsContainer.appendChild(btn);
      });

      // 渲染當前卡組資訊
      const currentDeck = decks.find(d => d.id === currentDeckId);
      document.getElementById('current-manage-deck-title').textContent = currentDeck.name;
      document.getElementById('current-manage-deck-count').textContent = `${currentDeck.cards.length} 張卡片`;

      // 渲染卡片清單 Grid
      const cardsGrid = document.getElementById('cards-grid');
      cardsGrid.innerHTML = '';

      if (currentDeck.cards.length === 0) {
        cardsGrid.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-sm font-medium">此卡組尚無卡片，請點擊「新增卡片」開始建立。</p>
          </div>
        `;
        return;
      }

      currentDeck.cards.forEach((card, index) => {
        const cardBox = document.createElement('div');
        cardBox.className = "bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow";
        
        let imgHTML = card.image 
          ? `<img src="${card.image}" class="w-full h-36 object-cover bg-slate-100" onerror="this.src='https://placehold.co/400x200/e2e8f0/64748b?text=載入失敗';">`
          : `<div class="w-full h-24 bg-slate-100 flex items-center justify-center text-slate-400 text-xs"><i class="fa-regular fa-font mr-1"></i> 純文字提示</div>`;

        cardBox.innerHTML = `
          <div>
            ${imgHTML}
            <div class="p-4">
              <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-500 bg-indigo-50 px-2 py-0.5 rounded">卡片 #${index + 1}</span>
              <h4 class="font-bold text-slate-800 text-base mt-1.5 line-clamp-1">${escapeHTML(card.title)}</h4>
              ${card.prompt ? `<p class="text-xs text-slate-500 mt-1 line-clamp-2"><span class="font-semibold text-slate-600">提示詞：</span>${escapeHTML(card.prompt)}</p>` : ''}
              <p class="text-xs text-slate-600 mt-2 line-clamp-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">${escapeHTML(card.content)}</p>
            </div>
          </div>
          <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2">
            <button onclick="openCardModal('${card.id}')" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all">
              <i class="fa-solid fa-pen-to-square mr-1"></i>編輯
            </button>
            <button onclick="deleteCard('${card.id}')" class="px-3 py-1.5 text-xs font-semibold text-rose-500 hover:bg-rose-50 rounded-lg transition-all">
              <i class="fa-solid fa-trash mr-1"></i>刪除
            </button>
          </div>
        `;
        cardsGrid.appendChild(cardBox);
      });
    }

    // HTML 特殊字元跳脫保護
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // ================= 卡組 Modal 操作 =================

    function openDeckModal(isEdit = false) {
      editingDeckId = isEdit ? currentDeckId : null;
      const modal = document.getElementById('deck-modal');
      const title = document.getElementById('deck-modal-title');
      const input = document.getElementById('deck-name-input');

      if (isEdit) {
        title.textContent = "重命名卡組";
        const deck = decks.find(d => d.id === currentDeckId);
        input.value = deck ? deck.name : '';
      } else {
        title.textContent = "新增卡組";
        input.value = '';
      }
      modal.classList.remove('hidden');
    }

    function closeDeckModal() {
      document.getElementById('deck-modal').classList.add('hidden');
    }

    function saveDeck() {
      const input = document.getElementById('deck-name-input');
      const name = input.value.trim();
      if (!name) return;

      if (editingDeckId) {
        const deck = decks.find(d => d.id === editingDeckId);
        if (deck) deck.name = name;
      } else {
        const newDeck = {
          id: 'deck-' + Date.now(),
          name: name,
          cards: []
        };
        decks.push(newDeck);
        currentDeckId = newDeck.id;
      }

      saveData();
      closeDeckModal();
      renderManageView();
    }

    function editCurrentDeck() {
      openDeckModal(true);
    }

    function deleteCurrentDeck() {
      if (decks.length <= 1) {
        alert("最少需保留一個卡組！");
        return;
      }
      const deck = decks.find(d => d.id === currentDeckId);
      if (confirm(`確定要刪除「${deck.name}」及其所有卡片嗎？`)) {
        decks = decks.filter(d => d.id !== currentDeckId);
        currentDeckId = decks[0].id;
        saveData();
        renderManageView();
      }
    }

    // ================= 卡片 Modal 操作 =================

    function openCardModal(cardId = null) {
      editingCardId = cardId;
      currentUploadedBase64 = '';

      const modal = document.getElementById('card-modal');
      const modalTitle = document.getElementById('card-modal-title');
      const form = document.getElementById('card-form');
      
      form.reset();
      
      const currentDeck = decks.find(d => d.id === currentDeckId);
      if (!currentDeck) return;

      if (cardId) {
        modalTitle.textContent = "編輯卡片";
        const card = currentDeck.cards.find(c => c.id === cardId);
        if (card) {
          document.getElementById('card-front-prompt').value = card.prompt || '';
          document.getElementById('card-title').value = card.title || '';
          document.getElementById('card-back-content').value = card.content || '';

          if (card.image.startsWith('data:image')) {
            // 本地圖片 (Base64)
            document.querySelector('input[name="image-source-type"][value="file"]').checked = true;
            currentUploadedBase64 = card.image;
          } else {
            document.querySelector('input[name="image-source-type"][value="url"]').checked = true;
            document.getElementById('card-img-url').value = card.image || '';
          }
        }
      } else {
        modalTitle.textContent = "新增卡片";
        document.querySelector('input[name="image-source-type"][value="url"]').checked = true;
      }

      toggleImageInputType();
      previewImageInput();
      modal.classList.remove('hidden');
    }

    function closeCardModal() {
      document.getElementById('card-modal').classList.add('hidden');
    }

    // 切換 URL 或 上傳本地檔案
    function toggleImageInputType() {
      const type = document.querySelector('input[name="image-source-type"]:checked').value;
      const urlBox = document.getElementById('image-url-box');
      const fileBox = document.getElementById('image-file-box');

      if (type === 'url') {
        urlBox.classList.remove('hidden');
        fileBox.classList.add('hidden');
      } else {
        urlBox.classList.add('hidden');
        fileBox.classList.remove('hidden');
      }
      previewImageInput();
    }

    // 處理檔案上傳
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentUploadedBase64 = evt.target.result;
          previewImageInput();
        };
        reader.readAsDataURL(file);
      }
    }

    // 預覽圖片
    function previewImageInput() {
      const type = document.querySelector('input[name="image-source-type"]:checked').value;
      const previewImg = document.getElementById('img-preview');
      const placeholder = document.getElementById('img-preview-placeholder');

      let src = '';
      if (type === 'url') {
        src = document.getElementById('card-img-url').value.trim();
      } else {
        src = currentUploadedBase64;
      }

      if (src) {
        previewImg.src = src;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        previewImg.src = '';
        previewImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    // 儲存卡片
    function saveCard() {
      const currentDeck = decks.find(d => d.id === currentDeckId);
      if (!currentDeck) return;

      const type = document.querySelector('input[name="image-source-type"]:checked').value;
      let finalImg = type === 'url' ? document.getElementById('card-img-url').value.trim() : currentUploadedBase64;

      const promptVal = document.getElementById('card-front-prompt').value.trim();
      const titleVal = document.getElementById('card-title').value.trim();
      const contentVal = document.getElementById('card-back-content').value.trim();

      if (!titleVal) {
        alert("請輸入卡片名稱 / 標題！");
        return;
      }

      if (editingCardId) {
        // 編輯
        const card = currentDeck.cards.find(c => c.id === editingCardId);
        if (card) {
          card.image = finalImg;
          card.prompt = promptVal;
          card.title = titleVal;
          card.content = contentVal;
        }
      } else {
        // 新增
        const newCard = {
          id: 'card-' + Date.now(),
          image: finalImg,
          prompt: promptVal,
          title: titleVal,
          content: contentVal
        };
        currentDeck.cards.push(newCard);
      }

      saveData();
      closeCardModal();
      renderManageView();
    }

    // 刪除卡片
    function deleteCard(cardId) {
      if (confirm("確定要刪除這張卡片嗎？")) {
        const currentDeck = decks.find(d => d.id === currentDeckId);
        if (currentDeck) {
          currentDeck.cards = currentDeck.cards.filter(c => c.id !== cardId);
          saveData();
          renderManageView();
        }
      }
    }
  </script>
</body>
</html>
